name: CI — Tests & Policy Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Validate Python syntax and PCI policy YAML
        run: |
          python -m compileall -q src tests
          python -c "import yaml; data = yaml.safe_load(open('config/pci_policy.yaml', encoding='utf-8')); assert isinstance(data, dict) and data"

      - name: Run unit and E2E tests (pytest)
        run: pytest -v --cov=vtx_vuln_triage --cov-report=term-missing

      - name: CLI smoke check
        run: python -m vtx_vuln_triage.main --help
