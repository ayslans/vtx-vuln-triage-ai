name: CI — Tests, Policy & AppSec Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Tests & Policy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Validate Python syntax and PCI policy YAML
        run: |
          python -m compileall -q src tests
          python -c "import yaml; data = yaml.safe_load(open('config/pci_policy.yaml', encoding='utf-8')); assert isinstance(data, dict) and data"

      - name: Run unit and E2E tests (pytest)
        run: pytest -v --cov=vtx_vuln_triage --cov-report=term-missing

      - name: CLI smoke check
        run: python -m vtx_vuln_triage.main --help

  appsec-scan:
    name: AppSec — Bandit SAST & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install runtime dependencies and AppSec scanners
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . bandit pip-audit

      - name: Run Bandit SAST (Medium+ severity & confidence)
        run: |
          mkdir -p artifacts
          bandit -r src -ll -ii -f json -o artifacts/bandit-report.json || true
          bandit -r src -ll -ii

      - name: Run pip-audit (dependency CVE check)
        run: |
          mkdir -p artifacts
          pip-audit --skip-editable --desc on --format json --output artifacts/pip-audit-report.json || true
          pip-audit --skip-editable --desc on

      - name: Upload AppSec scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appsec-reports-vtx-vuln-triage-ai
          path: artifacts/
          retention-days: 14

  trivy-scan:
    name: Trivy — Filesystem, IaC & Container SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Trivy Filesystem & IaC scan (vuln, secret, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "sarif"
          output: "artifacts/trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy FS SARIF to GitHub Security
        if: always() && hashFiles('artifacts/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "artifacts/trivy-fs.sarif"
          category: "trivy-fs-vtx-vuln-triage-ai"

      - name: Build container image (when Dockerfile exists)
        if: ${{ !cancelled() && hashFiles('Dockerfile') != '' }}
        run: docker build -t vtx-vuln-triage-ai:ci .

      - name: Trivy Container Image scan
        if: ${{ !cancelled() && hashFiles('Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: "image"
          image-ref: "vtx-vuln-triage-ai:ci"
          vuln-type: "os,library"
          format: "sarif"
          output: "artifacts/trivy-container.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy Container SARIF to GitHub Security
        if: always() && hashFiles('artifacts/trivy-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "artifacts/trivy-container.sarif"
          category: "trivy-container-vtx-vuln-triage-ai"

      - name: Upload Trivy SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-vtx-vuln-triage-ai
          path: artifacts/*.sarif
          if-no-files-found: ignore
          retention-days: 14
